<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Seguimiento nutricional deportivo profesional">
  <meta name="theme-color" content="#0D1117">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM Nutrition">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <title>LM Nutrition</title>

  <!-- Loading spinner inline (antes de que cargue tokens.css) -->
  <style>
    @keyframes _spin { to { transform: rotate(360deg); } }
    #app-loading-ring {
      width: 44px; height: 44px;
      border: 3px solid #2D333B; border-top-color: #00C896;
      border-radius: 50%;
      animation: _spin 800ms linear infinite;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="app-loading">
    <div id="app-loading-ring"></div>
    <div style="color:#8B949E;font-family:system-ui,sans-serif;font-size:13px;margin-top:12px">
      LM Nutrition
    </div>
  </div>

  <!-- App shell -->
  <div id="app">
    <main id="app-content" role="main" aria-label="Contenido principal"></main>
    <!-- BottomNav se inyecta aquí por BottomNav.js -->
  </div>

  <!-- Modal backdrop (singleton) -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal__handle"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Entry point -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
